<style>
/* Layout: one-screen study tool. Top bar (title, search, type filters), the web of notes filling
   the screen, and a reading panel (right on desktop, bottom sheet on phones). White and brown. */
:root {
  --bg: #ffffff; --panel: #faf7f4; --ink: #2e241d; --muted: #7a6a5e; --rule: #ece4dc;
  --notion: #7a5236; --arret: #4d7a4a; --essentiel: #b8402a; --article: #a9a39c; --cours: #c08a2e;
  --edge: rgba(122, 82, 54, .16); --edge-hi: rgba(122, 82, 54, .75); --halo: #ffffff;
  --display: "Fraunces", Georgia, serif; --body: "Figtree", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1612; --panel: #241d18; --ink: #efe6dd; --muted: #b3a294; --rule: #3a2f27;
  --notion: #d9a77f; --arret: #8fbf86; --essentiel: #f08a6b; --article: #776d64; --cours: #e2b25c;
  --edge: rgba(217, 167, 127, .16); --edge-hi: rgba(217, 167, 127, .8); --halo: #1b1612; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1b1612; --panel: #241d18; --ink: #efe6dd; --muted: #b3a294; --rule: #3a2f27;
  --notion: #d9a77f; --arret: #8fbf86; --essentiel: #f08a6b; --article: #776d64; --cours: #e2b25c;
  --edge: rgba(217, 167, 127, .16); --edge-hi: rgba(217, 167, 127, .8); --halo: #1b1612; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--bg); position: relative; z-index: 2; }
h1 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 0; letter-spacing: -.01em; }
h1 small { font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.search { flex: 1 1 220px; min-width: 0; max-width: 360px; }
.search input { width: 100%; font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
.search input:focus-visible, button:focus-visible { outline: 3px solid var(--notion); outline-offset: 1px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px var(--body); border: 1px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip span { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
main { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr minmax(320px, 420px); }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph:active { cursor: grabbing; }
.node text { font-family: var(--body); font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.node.notion text { font-weight: 600; font-size: 12px; }
.node.essentiel text { font-weight: 700; font-size: 12px; fill: var(--essentiel); }
.node { cursor: pointer; }
.dim { opacity: .12; }
aside { border-left: 1px solid var(--rule); background: var(--panel); overflow-y: auto; min-height: 0;
  padding-block: 20px 32px; padding-left: 22px; padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.kind { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
.note h1, .intro h2 { font-family: var(--display); font-weight: 500; font-size: 26px; line-height: 1.15; margin: 6px 0 12px; text-wrap: balance; }
.note h2 { font-family: var(--display); font-weight: 500; font-size: 18px; margin: 20px 0 8px; }
.note p, .note li, .intro p { line-height: 1.55; }
.note ul { padding-left: 18px; margin: 6px 0; display: grid; gap: 6px; }
.callout { background: var(--bg); border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.callout b.t { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
a.wl { color: var(--notion); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--notion) 35%, transparent); cursor: pointer; }
a.wl:hover { border-bottom-color: var(--notion); }
a.ext { color: var(--muted); }
.close { float: right; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; line-height: 1; padding: 4px 8px; }
.toplist { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
.toplist li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; }
.toplist span { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.legend { display: grid; gap: 4px; margin-top: 14px; color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  aside { position: absolute; left: 0; right: 0; bottom: 0; max-height: 46%; border-left: 0; border-top: 1px solid var(--rule);
    border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.08);
    padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 19px; } h1 small { display: none; }
  .note h1, .intro h2 { font-size: 22px; }
}

<script>
const DATA = {"nodes":[{"id":"Abus de dépendance","t":"notion","md":"# Abus de dépendance\n\n> [!abstract] Définition\n> Violence économique consacrée par l'[[Art. 1143]] : abus de l'état de dépendance du cocontractant pour obtenir un engagement qu'il n'aurait pas souscrit, avec un avantage manifestement excessif.\n\n## À retenir\n- Trois conditions : état de dépendance (économique, psychologique, affective) à l'égard du cocontractant (2018) ; abus procurant un avantage manifestement excessif ; engagement déterminé par la contrainte.\n- Issu de [[Civ. 1re, 30 mai 2000]] et [[Civ. 1re, 3 avr. 2002]].\n- Textes voisins : C. com. L. 420-2 et L. 442-1, abus de faiblesse (C. consom.).\n\n## Articles\n[[Art. 1143]]\n\n## Arrêts\n- [[Civ. 1re, 30 mai 2000]]\n- [[Civ. 1re, 3 avr. 2002]]\n\n## Voir aussi\n[[Violence]] · [[Clauses abusives]]\n\n## Sources\n[[CM4 Contrats]] · [[CM5 Contrats]]"},{"id":"Acceptation","t":"notion","md":"# Acceptation\n\n> [!abstract] Définition\n> Manifestation de la volonté de son auteur d'être lié dans les termes de l'offre ([[Art. 1118]]).\n\n## À retenir\n- Doit être conforme ; sinon contre-proposition valant offre nouvelle.\n- Expresse ou tacite (comportement non équivoque).\n- Le [[Silence]] ne vaut pas acceptation par principe.\n\n## Articles\n[[Art. 1118]]\n\n## Voir aussi\n[[Offre]] · [[Silence]] · [[Contrat entre absents]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Acte juridique et fait juridique","t":"notion","md":"# Acte juridique et fait juridique\n\n> [!abstract] Définition\n> L'acte juridique est une manifestation de volonté destinée à produire des effets de droit (contrat, testament, engagement unilatéral) ; le fait juridique est un événement, souvent illicite, auquel la loi attache des effets (délit, quasi-délit).\n\n## À retenir\n- Premier semestre : obligations nées d'un acte juridique ; second semestre : responsabilité extracontractuelle (fait juridique).\n- Exemple du cours : une conduite trop rapide causant un préjudice écologique fait naître une créance sans contrat.\n\n## Articles\n[[Art. 1100]] · [[Art. 1240]]\n\n## Voir aussi\n[[Obligation]] · [[Engagement unilatéral de volonté]]\n\n## Sources\n[[CM1 Contrats]] · [[CM2 Contrats]]"},{"id":"Action interrogatoire","t":"notion","md":"# Action interrogatoire\n\n> [!abstract] Définition\n> Mécanisme permettant de purger une incertitude en interrogeant par écrit l'intéressé, qui doit répondre dans un délai raisonnable.\n\n## À retenir\n- Pacte de préférence ([[Art. 1123]] al. 3-4) : faute de réponse, le bénéficiaire perd la nullité et la substitution, pas les dommages-intérêts contre le promettant.\n- Représentation ([[Art. 1158]]) : faute de réponse, le représentant est réputé habilité.\n- Nullité ([[Art. 1183]]) : la victime doit confirmer ou agir dans les 6 mois.\n- Conseil pratique : la démarche révèle l'intérêt du tiers et prouve qu'il connaissait le pacte.\n\n## Articles\n[[Art. 1123]] · [[Art. 1158]] · [[Art. 1183]]\n\n## Voir aussi\n[[Pacte de préférence]] · [[Représentation]] · [[Nullité relative]]\n\n## Sources\n[[CM3 Contrats]] · [[CM4 Contrats]] · [[TD2 Contrats]]"},{"id":"Assistance bénévole","t":"notion","md":"# Assistance bénévole\n\n> [!abstract] Définition\n> L'aide gratuite à autrui fait naître une convention d'assistance bénévole, donc un contrat.\n\n## À retenir\n- Enjeu : responsabilité contractuelle (pas de faute à prouver, manquement à l'obligation de sécurité) plutôt que délictuelle ; principe de non-cumul.\n- Peu importe que l'assistance soit offerte ou demandée (Civ. 1re, 27 janv. 1993 ; 18 janv. 2023).\n- Piège d'examen : raisonner en délictuel sans voir le contrat d'assistance.\n\n## Articles\n[[Art. 1240]]\n\n## Voir aussi\n[[Contrat]] · [[Classification des contrats]]\n\n## Sources\n[[TD1 Contrats]] · [[TD2 Contrats]]"},{"id":"Bonne foi","t":"notion","md":"# Bonne foi\n\n> [!abstract] Définition\n> Troisième principe directeur ([[Art. 1104]]) : les contrats doivent être négociés, formés et exécutés de bonne foi ; disposition d'ordre public.\n\n## À retenir\n- Notion fuyante et polysémique qui sanctionne les comportements déloyaux.\n- Fonde l'expansion du [[Devoir précontractuel d'information]] et l'encadrement des [[Pourparlers]].\n- Exemple du cours : le silence d'un professionnel face à une clause compromissoire insérée tardivement vaut-il acceptation ? Voir [[Silence]].\n\n## Articles\n[[Art. 1104]] · [[Art. 1112]]\n\n## Arrêts\n- [[Manoukian (Com., 26 nov. 2003)]]\n\n## Voir aussi\n[[Liberté contractuelle]] · [[Force obligatoire]] · [[Pourparlers]]\n\n## Sources\n[[CM2 Contrats]]"},{"id":"Caducité","t":"notion","md":"# Caducité\n\n> [!abstract] Définition\n> Disparition d'un acte valablement formé, par la défaillance d'un élément essentiel postérieurement à sa formation ([[Art. 1186]]).\n\n## À retenir\n- Offre caduque ([[Art. 1117]]) ; chose future qui n'advient pas ; disparition de la contrepartie en cours d'exécution.\n\n## Articles\n[[Art. 1186]] · [[Art. 1117]]\n\n## Voir aussi\n[[Offre]] · [[Contrepartie illusoire ou dérisoire]] · [[Nullité relative]]\n\n## Sources\n[[CM4 Contrats]] · [[CM5 Contrats]]"},{"id":"Capacité","t":"notion","md":"# Capacité\n\n> [!abstract] Définition\n> Aptitude à acquérir un droit et à l'exercer ; toute personne physique peut contracter sauf incapacité prévue par la loi ([[Art. 1145]]).\n\n## À retenir\n- Incapables : mineurs non émancipés et majeurs protégés ([[Art. 1146]]) ; nullité relative ([[Art. 1147]]).\n- Actes courants possibles seul s'ils sont conclus à des conditions normales ([[Art. 1148]]) ; annulables pour simple lésion pour le mineur ([[Art. 1149]]).\n- Mineur : actes de la vie courante, d'administration, de disposition (régimes gradués) ; restitutions limitées au profit retiré ([[Art. 1352-4]]).\n- Majeurs protégés : sauvegarde de justice, curatelle, tutelle ; mandat de protection future, habilitation familiale.\n- Défense du cocontractant : acte utile et sans lésion, profit, confirmation ([[Art. 1151]]).\n- Personnes morales : capacité dès la personnalité juridique, limitée par leurs règles propres (2018).\n\n## Articles\n[[Art. 1145]] · [[Art. 1146]] · [[Art. 1147]] · [[Art. 1148]] · [[Art. 1149]] · [[Art. 1151]] · [[Art. 1352-4]]\n\n## Voir aussi\n[[Conditions de validité du contrat]] · [[Insanité d'esprit]] · [[Représentation]] · [[Lésion]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Classification des contrats","t":"notion","md":"# Classification des contrats\n\n> [!abstract] Définition\n> Qualifier un contrat déclenche un régime : chaque distinction a un article et un intérêt pratique.\n\n## À retenir\n- [[Contrat synallagmatique]] / unilatéral ([[Art. 1106]]) : exception d'inexécution, règle du double original.\n- Onéreux / gratuit ([[Art. 1107]]) : formation plus rigoureuse du contrat gratuit.\n- Commutatif / [[Contrat aléatoire]] ([[Art. 1108]]) : « l'aléa chasse la lésion ».\n- Consensuel / solennel / réel ([[Art. 1109]]) : consensualisme par principe ; donation notariée (solennel), prêt et dépôt (réel).\n- Gré à gré / [[Contrat d'adhésion]] ([[Art. 1110]]) : interprétation contre le rédacteur (art. 1190) et contrôle des [[Clauses abusives]] (art. 1171).\n- Contrat cadre / contrat d'application ([[Art. 1111]]) : prix fixé dans l'application, voir [[Détermination du prix]].\n- Exécution instantanée / successive ([[Art. 1111-1]]) : restitutions intégrales ou résiliation.\n- Nommé / innommé ([[Art. 1105]]) ; interne / international (critères juridique et économique) ; électronique ([[Contrat électronique]]).\n- Qualifications du TD1 : bail d'habitation, assurance, testament (acte unilatéral), donation de tableau, achat aux enchères en ligne, abonnement.\n\n## Articles\n[[Art. 1106]] · [[Art. 1107]] · [[Art. 1108]] · [[Art. 1109]] · [[Art. 1110]] · [[Art. 1111]] · [[Art. 1111-1]]\n\n## Voir aussi\n[[Contrat]] · [[Droit commun et droit spécial]]\n\n## Sources\n[[CM2 Contrats]] · [[TD1 Contrats]]"},{"id":"Clauses abusives","t":"notion","md":"# Clauses abusives\n\n> [!abstract] Définition\n> Dans un contrat d'adhésion, toute clause non négociable créant un déséquilibre significatif entre les droits et obligations des parties est réputée non écrite ([[Art. 1171]]).\n\n## À retenir\n- Ne porte ni sur l'objet principal ni sur l'adéquation du prix.\n- Sanction : réputée non écrite, contrat maintenu ; ordre public, imprescriptible.\n- Articulation ([[Art. 1105]]) : consommateur → C. consom. L. 212-1 ; entre professionnels → C. com. L. 442-1 ; art. 1171 résiduel (particuliers, sociétés de financement…).\n\n## Articles\n[[Art. 1171]] · [[Art. 1110]] · [[Art. 1105]]\n\n## Voir aussi\n[[Contrat d'adhésion]] · [[Droit commun et droit spécial]] · [[Obligation essentielle]]\n\n## Sources\n[[CM2 Contrats]] · [[CM5 Contrats]]"},{"id":"Conditions de validité du contrat","t":"notion","md":"# Conditions de validité du contrat\n\n> [!abstract] Définition\n> Depuis 2016, trois conditions ([[Art. 1128]]) : le consentement des parties, leur capacité, un contenu licite et certain.\n\n## À retenir\n- Le « contenu » remplace l'objet et la cause : voir [[Contenu du contrat]].\n- Consentement : [[Capacité]], [[Insanité d'esprit]], [[Vices du consentement]].\n\n## Articles\n[[Art. 1128]]\n\n## Voir aussi\n[[Capacité]] · [[Vices du consentement]] · [[Contenu du contrat]] · [[Nullité relative]]\n\n## Sources\n[[CM4 Contrats]] · [[CM5 Contrats]]"},{"id":"Contenu du contrat","t":"notion","md":"# Contenu du contrat\n\n> [!abstract] Définition\n> Troisième condition de validité : un contenu licite et certain ([[Art. 1128]]), régi par les [[Art. 1162]] à [[Art. 1171]].\n\n## À retenir\n- Remplace l'objet (ce qu'on a voulu) et la cause (pourquoi) ; la cause disparaît comme mot, ses fonctions demeurent : but licite ([[Art. 1162]]), contrepartie ([[Art. 1169]]), obligation essentielle ([[Art. 1170]]), motif des libéralités ([[Art. 1135]]), caducité ([[Art. 1186]]).\n- Prestation présente ou future, possible, déterminée ou déterminable ([[Art. 1163]]) ; qualité ([[Art. 1166]]).\n- Contrats antérieurs au 1er oct. 2016 : anciens art. 1108 et 1126 à 1133.\n\n## Articles\n[[Art. 1128]] · [[Art. 1162]] · [[Art. 1163]] · [[Art. 1166]]\n\n## Arrêts\n- [[Point club vidéo (Civ. 1re, 3 juill. 1996)]]\n\n## Voir aussi\n[[Ordre public]] · [[Détermination du prix]] · [[Lésion]] · [[Clauses abusives]] · [[Contrepartie illusoire ou dérisoire]] · [[Obligation essentielle]]\n\n## Sources\n[[CM5 Contrats]]"},{"id":"Contrat aléatoire","t":"notion","md":"# Contrat aléatoire\n\n> [!abstract] Définition\n> Contrat dont les effets dépendent d'un événement incertain ([[Art. 1108]] al. 2) : assurance, rente viagère, jeu.\n\n## À retenir\n- Disproportion acceptée : le risque est l'objet même du contrat.\n- « L'aléa chasse la lésion » : pas de [[Lésion]] dans un contrat aléatoire, si l'aléa est réel.\n\n## Articles\n[[Art. 1108]]\n\n## Voir aussi\n[[Classification des contrats]] · [[Lésion]]\n\n## Sources\n[[CM1 Contrats]] · [[CM2 Contrats]] · [[CM5 Contrats]]"},{"id":"Contrat d'adhésion","t":"notion","md":"# Contrat d'adhésion\n\n> [!abstract] Définition\n> Contrat comportant un ensemble de clauses non négociables, déterminées à l'avance par l'une des parties ([[Art. 1110]], rédaction 2018).\n\n## À retenir\n- S'interprète contre celui qui l'a proposé ([[Art. 1190]]).\n- Seul concerné par le contrôle des [[Clauses abusives]] de l'[[Art. 1171]].\n\n## Articles\n[[Art. 1110]] · [[Art. 1171]] · [[Art. 1190]]\n\n## Voir aussi\n[[Classification des contrats]] · [[Clauses abusives]]\n\n## Sources\n[[CM2 Contrats]] · [[TD1 Contrats]] · [[CM5 Contrats]]"},{"id":"Contrat entre absents","t":"notion","md":"# Contrat entre absents\n\n> [!abstract] Définition\n> Contrat conclu entre personnes non présentes au même endroit : il est formé dès que l'acceptation parvient à l'offrant, au lieu où elle est parvenue ([[Art. 1121]], théorie de la réception).\n\n## À retenir\n- Enjeux : date et lieu de formation (loi applicable, juge compétent, rétractation).\n\n## Articles\n[[Art. 1121]]\n\n## Voir aussi\n[[Acceptation]] · [[Contrat électronique]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Contrat synallagmatique","t":"notion","md":"# Contrat synallagmatique\n\n> [!abstract] Définition\n> Contrat où les parties s'obligent réciproquement les unes envers les autres ([[Art. 1106]]).\n\n## À retenir\n- Chaque partie est créancière et débitrice (vente, bail).\n- Intérêts : exception d'inexécution, double original.\n\n## Articles\n[[Art. 1106]]\n\n## Voir aussi\n[[Classification des contrats]] · [[Obligation]]\n\n## Sources\n[[CM1 Contrats]] · [[TD1 Contrats]]"},{"id":"Contrat électronique","t":"notion","md":"# Contrat électronique\n\n> [!abstract] Définition\n> Contrat conclu par voie électronique, avec les mêmes garanties qu'un écrit ([[Art. 1125]] et s., [[Art. 1127-1]] et s.).\n\n## À retenir\n- L'offrant reste engagé tant que l'offre est accessible de son fait.\n- Règle du double clic ([[Art. 1127-2]]) ; accusé de réception sans délai ; documents réputés reçus dès qu'ils sont accessibles.\n\n## Articles\n[[Art. 1125]] · [[Art. 1127-1]] · [[Art. 1127-2]]\n\n## Voir aussi\n[[Contrat entre absents]] · [[Classification des contrats]]\n\n## Sources\n[[CM4 Contrats]] · [[TD1 Contrats]]"},{"id":"Contrat","t":"notion","md":"# Contrat\n\n> [!abstract] Définition\n> Accord de volontés entre deux ou plusieurs personnes destiné à créer, modifier, transmettre ou éteindre des obligations ([[Art. 1101]]).\n\n## À retenir\n- Depuis la [[Réforme de 2016]], contrat et convention sont synonymes : l'ancien art. 1101 ne visait que la création d'obligations.\n- Distinguer le *negotium* (l'opération) et l'*instrumentum* (l'écrit).\n- Le contrat n'est pas une simple somme d'obligations : la [[Force obligatoire]] en est le contenant (thèse de P. Ancel).\n- À ne pas confondre avec l'acte juridique unilatéral (testament) ni avec le contrat unilatéral (donation) : voir [[Classification des contrats]].\n- Conventions non obligatoires : promesses politiques, actes de courtoisie, engagements d'honneur, [[Obligation naturelle]].\n\n## Articles\n[[Art. 1101]] · [[Art. 1128]]\n\n## Voir aussi\n[[Obligation]] · [[Acte juridique et fait juridique]] · [[Conditions de validité du contrat]] · [[Assistance bénévole]]\n\n## Sources\n[[CM1 Contrats]] · [[TD1 Contrats]]"},{"id":"Contrepartie illusoire ou dérisoire","t":"notion","md":"# Contrepartie illusoire ou dérisoire\n\n> [!abstract] Définition\n> Le contrat à titre onéreux est nul lorsque, lors de sa formation, la contrepartie convenue au profit de celui qui s'engage est illusoire ou dérisoire ([[Art. 1169]]).\n\n## À retenir\n- Reprend la fonction de l'ancienne cause de l'obligation.\n- Seule l'absence de contrepartie compte, pas son insuffisance ([[Cartier (Civ. 1re, 4 juill. 1995)]]).\n- Disparition ultérieure : [[Caducité]].\n\n## Articles\n[[Art. 1169]]\n\n## Arrêts\n- [[Cartier (Civ. 1re, 4 juill. 1995)]]\n- [[Point club vidéo (Civ. 1re, 3 juill. 1996)]]\n\n## Voir aussi\n[[Contenu du contrat]] · [[Lésion]] · [[Obligation essentielle]]\n\n## Sources\n[[CM5 Contrats]]"},{"id":"Devoir précontractuel d'information","t":"notion","md":"# Devoir précontractuel d'information\n\n> [!abstract] Définition\n> Celle des parties qui connaît une information dont l'importance est déterminante pour le consentement de l'autre doit l'en informer, si l'autre l'ignore légitimement ou lui fait confiance ([[Art. 1112-1]]).\n\n## À retenir\n- Conditions : information connue, déterminante, en lien direct et nécessaire avec le contenu du contrat ou la qualité des parties, légitimement ignorée.\n- Ne porte **pas** sur l'estimation de la valeur de la prestation (al. 2) : voir [[Baldus (Civ. 1re, 3 mai 2000)]].\n- D'ordre public : ne peut être ni limité ni exclu (al. 5).\n- Preuve : le créancier prouve que l'information lui était due, le débiteur qu'il l'a fournie (al. 4).\n- Sanctions : dommages-intérêts ([[Art. 1240]]) ; nullité si [[Dol]] par réticence ([[Art. 1137]] al. 2) ou vice du consentement.\n- Intensité variable : entre professionnels, sur les caractéristiques ; envers un profane, véritable devoir de curiosité.\n- Voisins : obligation de mise en garde, devoir de conseil ; droits spéciaux : délai de réflexion, droit de repentir.\n\n## Articles\n[[Art. 1112-1]] · [[Art. 1137]] · [[Art. 1240]]\n\n## Arrêts\n- [[Com., 14 mai 2025]]\n- [[Civ. 1re, 3 déc. 2025 (cercueil)]]\n\n## Voir aussi\n[[Bonne foi]] · [[Dol]] · [[Pourparlers]]\n\n## Sources\n[[CM2 Contrats]] · [[CM3 Contrats]]"},{"id":"Dol","t":"notion","md":"# Dol\n\n> [!abstract] Définition\n> Fait d'obtenir le consentement de l'autre par des manœuvres ou des mensonges ([[Art. 1137]] al. 1) ; erreur provoquée.\n\n## À retenir\n- Élément matériel : manœuvres, mensonge, réticence dolosive (dissimulation intentionnelle d'une information déterminante, al. 2).\n- Le silence sur l'estimation de la valeur n'est pas un dol (al. 3, 2018), pour toute partie : voir [[Baldus (Civ. 1re, 3 mai 2000)]] et ses limites ([[Vilgrain (Com., 27 févr. 1996)]]).\n- Élément intentionnel : volonté de tromper, prouvée par la victime.\n- Doit émaner du cocontractant, de son représentant ou d'un tiers de connivence ([[Art. 1138]]).\n- L'erreur provoquée est toujours excusable et peut porter sur la valeur ou un motif ([[Art. 1139]]).\n- Fin du dol incident : nullité si conditions substantiellement différentes ([[Art. 1130]]).\n- Sanctions : nullité, et/ou dommages-intérêts ([[Art. 1240]]).\n\n## Articles\n[[Art. 1137]] · [[Art. 1138]] · [[Art. 1139]] · [[Art. 1130]]\n\n## Arrêts\n- [[Baldus (Civ. 1re, 3 mai 2000)]]\n- [[Porcherie (Civ. 3e, 2 oct. 1974)]]\n- [[Vilgrain (Com., 27 févr. 1996)]]\n- [[Civ. 1re, 5 mai 2021]]\n\n## Voir aussi\n[[Erreur]] · [[Devoir précontractuel d'information]] · [[Vices du consentement]]\n\n## Sources\n[[CM3 Contrats]] · [[CM4 Contrats]]"},{"id":"Droit commun et droit spécial","t":"notion","md":"# Droit commun et droit spécial\n\n> [!abstract] Définition\n> Principe d'articulation ([[Art. 1105]]) : les contrats nommés ou innommés sont soumis aux règles générales, sous réserve des règles particulières propres à chacun.\n\n## À retenir\n- Le spécial déroge au général : consommation, travail, assurances.\n- Le droit des contrats irrigue tous les droits spéciaux (sociétés, travail, endettement).\n- Application : articulation des régimes de [[Clauses abusives]] (C. consom., C. com., art. 1171).\n\n## Articles\n[[Art. 1105]]\n\n## Voir aussi\n[[Classification des contrats]] · [[Clauses abusives]]\n\n## Sources\n[[CM1 Contrats]] · [[CM2 Contrats]]"},{"id":"Droit impératif et droit supplétif","t":"notion","md":"# Droit impératif et droit supplétif\n\n> [!abstract] Définition\n> Principe d'articulation : la plupart des règles du Code sont supplétives (les parties peuvent y déroger) ; certaines sont impératives, d'ordre public.\n\n## À retenir\n- Exemples de règles impératives : [[Art. 1104]] (bonne foi), [[Art. 1112-1]] (devoir d'information), [[Art. 1210]] (engagements perpétuels), [[Art. 1171]] (clauses abusives).\n\n## Articles\n[[Art. 1102]] · [[Art. 6]]\n\n## Voir aussi\n[[Ordre public]] · [[Liberté contractuelle]]\n\n## Sources\n[[CM2 Contrats]] · [[TD2 Contrats]]"},{"id":"Détermination du prix","t":"notion","md":"# Détermination du prix\n\n> [!abstract] Définition\n> Le juste prix est l'équivalent voulu par les parties, pas l'équivalent objectif : principe d'intangibilité du prix.\n\n## À retenir\n- [[Ass. plén., 1er déc. 1995]] : l'ancien art. 1129 ne s'applique pas au prix ; fixation unilatérale admise, abus contrôlé.\n- Depuis 2016 : fixation unilatérale par exception : contrats cadre ([[Art. 1164]]) et prestation de service ([[Art. 1165]]) ; abus : dommages-intérêts et, le cas échéant, résolution ; pas de révision judiciaire.\n- Clauses d'indexation encadrées (CMF L. 112-1 s.) ; indice disparu remplacé ([[Art. 1167]]).\n- Correctifs : contrôle étatique, [[Lésion]], [[Imprévision]] ([[Art. 1195]]), réduction des honoraires excessifs.\n\n## Articles\n[[Art. 1164]] · [[Art. 1165]] · [[Art. 1167]] · [[Art. 1195]]\n\n## Arrêts\n- [[Ass. plén., 1er déc. 1995]]\n\n## Voir aussi\n[[Contenu du contrat]] · [[Lésion]] · [[Classification des contrats]]\n\n## Sources\n[[CM5 Contrats]]"},{"id":"Engagement unilatéral de volonté","t":"notion","md":"# Engagement unilatéral de volonté\n\n> [!abstract] Définition\n> Acte par lequel une seule personne s'oblige par sa seule volonté ; il peut générer une obligation à certaines conditions et a alors la même force qu'un contrat.\n\n## À retenir\n- Conditions citées en TD : promesse d'un avantage, engagement démontré de l'auteur, croyance légitime du bénéficiaire.\n- Exemples : adhésion à une association (CM1), chartes RSE et plans de vigilance (qui en est le créancier ? consommateurs, associations).\n- Loterie publicitaire : annoncer un gain en termes clairs fait naître une offre acceptée, donc un contrat (TD1, doc. 4).\n\n## Articles\n[[Art. 1100]]\n\n## Voir aussi\n[[Obligation naturelle]] · [[Acte juridique et fait juridique]] · [[Offre]]\n\n## Sources\n[[CM1 Contrats]] · [[TD1 Contrats]]"},{"id":"Engagements perpétuels","t":"notion","md":"# Engagements perpétuels\n\n> [!abstract] Définition\n> Les engagements perpétuels sont prohibés ([[Art. 1210]]) : disposition d'ordre public protégeant la liberté individuelle.\n\n## À retenir\n- Sanction : pas la nullité, mais une faculté de résiliation à tout moment avec préavis ([[Civ. 1re, 25 sept. 2024]]).\n- Un contrat long n'est pas forcément perpétuel : l'appréciation tient compte de la personne (physique ou morale).\n\n## Articles\n[[Art. 1210]]\n\n## Arrêts\n- [[Civ. 1re, 25 sept. 2024]]\n\n## Voir aussi\n[[Force obligatoire]] · [[Pacte de préférence]]\n\n## Sources\n[[TD2 Contrats]]"},{"id":"Erreur","t":"notion","md":"# Erreur\n\n> [!abstract] Définition\n> Discordance entre la croyance de l'errans et la réalité ; cause de nullité si elle porte sur les qualités essentielles de la prestation ou du cocontractant et n'est pas inexcusable ([[Art. 1132]]).\n\n## À retenir\n- Erreur obstacle (nature de l'acte, objet) : pas de rencontre des volontés ; nullité relative désormais.\n- Qualités essentielles : conception subjective, entrées dans le champ contractuel ([[Art. 1133]]) ; peut porter sur sa propre prestation.\n- L'acceptation d'un aléa exclut l'erreur ([[Art. 1133]] al. 3).\n- Sur la personne : seulement *intuitu personae* ([[Art. 1134]]).\n- Indifférentes : sur la valeur ([[Art. 1136]]), sur les motifs ([[Art. 1135]]), sauf libéralités.\n- Erreur inexcusable : pas de nullité ; appréciation in concreto, plus sévère pour le professionnel.\n\n## Articles\n[[Art. 1132]] · [[Art. 1133]] · [[Art. 1134]] · [[Art. 1135]] · [[Art. 1136]]\n\n## Arrêts\n- [[Poussin I (Civ. 1re, 22 févr. 1978)]]\n- [[Poussin II (Civ. 1re, 13 déc. 1983)]]\n- [[Verrou de Fragonard (Civ. 1re, 24 mars 1987)]]\n- [[Civ. 1re, 5 mai 2021]]\n\n## Voir aussi\n[[Dol]] · [[Vices du consentement]] · [[Lésion]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Force obligatoire","t":"notion","md":"# Force obligatoire\n\n> [!abstract] Définition\n> Deuxième principe directeur ([[Art. 1103]], ex-1134) : les contrats légalement formés tiennent lieu de loi à ceux qui les ont faits.\n\n## À retenir\n- Fondements : politique (autonomie de la volonté, Lumières, 1789) et économique (économie de marché).\n- En droit français, le créancier peut obtenir l'exécution forcée en nature ; le droit anglo-américain privilégie la réparation (« efficient breach »).\n- Le juge ne révise pas le contrat, sauf abus caractérisé (taux usuraire) ; voir [[Imprévision]].\n- Tempéraments : [[Ordre public]], [[Lésion]], clauses de compliance (loi Sapin II), sanctions internationales (contrats avec la Russie).\n- Interprétation : une clause obscure s'interprète contre son rédacteur ; en assurance, en faveur de l'assuré.\n\n## Articles\n[[Art. 1103]] · [[Art. 1190]]\n\n## Voir aussi\n[[Liberté contractuelle]] · [[Bonne foi]] · [[Engagements perpétuels]]\n\n## Sources\n[[CM1 Contrats]] · [[CM2 Contrats]]"},{"id":"Imprévision","t":"notion","md":"# Imprévision\n\n> [!abstract] Définition\n> Révision ou résolution du contrat devenu excessivement onéreux pour une partie à la suite d'un changement de circonstances imprévisible ([[Art. 1195]]).\n\n## À retenir\n- Évoquée au CM1 à propos des contrats en dollars avec des parties russes sous sanctions : tension entre force obligatoire stricte et bonne foi.\n- À approfondir dans la partie exécution du contrat.\n\n## Articles\n[[Art. 1195]]\n\n## Voir aussi\n[[Force obligatoire]] · [[Détermination du prix]]\n\n## Sources\n[[CM1 Contrats]] · [[CM5 Contrats]]"},{"id":"Insanité d'esprit","t":"notion","md":"# Insanité d'esprit\n\n> [!abstract] Définition\n> Il faut être sain d'esprit pour consentir valablement ([[Art. 1129]], [[Art. 414-1]]) : l'acte d'une personne capable mais atteinte d'un trouble mental est annulable.\n\n## À retenir\n- Trouble grave, quelle qu'en soit la cause (alcool, drogue), contemporain de l'acte ; état habituel suffisant sauf preuve d'un intervalle lucide (Civ. 1re, 11 juin 1980).\n- Nullité relative, 5 ans ; après décès, les héritiers n'agissent que dans 3 cas (art. 414-2), sauf pour les libéralités (art. 901).\n\n## Articles\n[[Art. 1129]] · [[Art. 414-1]]\n\n## Voir aussi\n[[Capacité]] · [[Vices du consentement]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Liberté contractuelle","t":"notion","md":"# Liberté contractuelle\n\n> [!abstract] Définition\n> Premier principe directeur ([[Art. 1102]]) : liberté de contracter ou non, de choisir son cocontractant et de déterminer le contenu du contrat, dans les limites de la loi.\n\n## À retenir\n- Valeur **constitutionnelle** (art. 4 DDHC) : [[Cons. const., 13 juin 2013]].\n- Limites : l'[[Ordre public]], les obligations légales de contracter (assurance automobile), les règles anti-discrimination.\n- Rattachée à la liberté du commerce et de l'industrie et à la liberté d'entreprendre.\n\n## Articles\n[[Art. 1102]] · [[Art. 6]]\n\n## Arrêts\n- [[Cons. const., 13 juin 2013]]\n\n## Voir aussi\n[[Force obligatoire]] · [[Bonne foi]] · [[Ordre public]] · [[Droit impératif et droit supplétif]]\n\n## Sources\n[[CM2 Contrats]] · [[TD2 Contrats]]"},{"id":"Lésion","t":"notion","md":"# Lésion\n\n> [!abstract] Définition\n> Préjudice né du déséquilibre des prestations à la conclusion ; vice originel et objectif, en principe indifférent ([[Art. 1168]]).\n\n## À retenir\n- Exceptions légales : vente d'immeuble, lésion de plus des 7/12 au profit du vendeur ([[Art. 1674]], action dans les 2 ans) ; mineurs ([[Art. 1149]]) et majeurs protégés.\n- Réduction jurisprudentielle des honoraires excessifs des mandataires.\n- « L'aléa chasse la lésion » : voir [[Contrat aléatoire]].\n- Distinguer de l'erreur sur la valeur ([[Art. 1136]]) et de la [[Contrepartie illusoire ou dérisoire]].\n\n## Articles\n[[Art. 1168]] · [[Art. 1674]] · [[Art. 1149]] · [[Art. 1136]]\n\n## Arrêts\n- [[Cartier (Civ. 1re, 4 juill. 1995)]]\n\n## Voir aussi\n[[Contrat aléatoire]] · [[Détermination du prix]] · [[Capacité]] · [[Erreur]]\n\n## Sources\n[[CM2 Contrats]] · [[CM5 Contrats]]"},{"id":"Mandat apparent","t":"notion","md":"# Mandat apparent\n\n> [!abstract] Définition\n> L'acte conclu sans pouvoir devient opposable au représenté si le tiers a légitimement cru aux pouvoirs du représentant, notamment du fait du comportement du représenté ([[Art. 1156]] al. 1).\n\n## À retenir\n- Consacre [[Ass. plén., 13 déc. 1962]].\n\n## Articles\n[[Art. 1156]]\n\n## Arrêts\n- [[Ass. plén., 13 déc. 1962]]\n\n## Voir aussi\n[[Représentation]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Nullité relative","t":"notion","md":"# Nullité relative\n\n> [!abstract] Définition\n> Sanction des règles protégeant un intérêt privé : seule la partie protégée peut l'invoquer ; la confirmation est possible.\n\n## À retenir\n- Vices du consentement ([[Art. 1131]]) et incapacité ([[Art. 1147]]).\n- Délai de 5 ans ([[Art. 1144]], art. 2224), délai butoir de 20 ans.\n- Confirmation ([[Art. 1182]]) ; [[Action interrogatoire]] ([[Art. 1183]]) ; nullité partielle possible ([[Art. 1184]]).\n- Dommages-intérêts complémentaires ([[Art. 1178]] al. 4).\n\n## Articles\n[[Art. 1131]] · [[Art. 1144]] · [[Art. 1147]] · [[Art. 1178]] · [[Art. 1182]] · [[Art. 1183]] · [[Art. 1184]]\n\n## Voir aussi\n[[Vices du consentement]] · [[Capacité]] · [[Caducité]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Négociation encadrée","t":"notion","md":"# Négociation encadrée\n\n> [!abstract] Définition\n> Pour les contrats à fort enjeu, les parties organisent la négociation par des accords préparatoires : lettre d'intention, accord de principe, accord partiel.\n\n## À retenir\n- Ces accords ne concluent pas le contrat définitif mais créent des obligations : confidentialité ([[Art. 1112-2]]), sincérité, exclusivité.\n- Leur violation engage la responsabilité contractuelle : preuve plus facile qu'en délictuel.\n\n## Articles\n[[Art. 1112-2]]\n\n## Arrêts\n- [[Com., 22 mars 2017]]\n\n## Voir aussi\n[[Pourparlers]]\n\n## Sources\n[[CM3 Contrats]] · [[TD2 Contrats]]"},{"id":"Obligation essentielle","t":"notion","md":"# Obligation essentielle\n\n> [!abstract] Définition\n> Toute clause qui prive de sa substance l'obligation essentielle du débiteur est réputée non écrite ([[Art. 1170]]).\n\n## À retenir\n- Héritage de [[Chronopost (Com., 22 oct. 1996)]] puis [[Faurecia 2 (Com., 29 juin 2010)]] : seule la clause qui contredit la portée de l'obligation essentielle est écartée.\n- S'applique à tous les contrats (gré à gré ou adhésion) ; sanction imprescriptible.\n- Faute lourde : neutralise les limitations de responsabilité ([[Art. 1231-3]]).\n\n## Articles\n[[Art. 1170]] · [[Art. 1231-3]]\n\n## Arrêts\n- [[Chronopost (Com., 22 oct. 1996)]]\n- [[Faurecia 2 (Com., 29 juin 2010)]]\n\n## Voir aussi\n[[Clauses abusives]] · [[Contrepartie illusoire ou dérisoire]] · [[Contenu du contrat]]\n\n## Sources\n[[CM5 Contrats]]"},{"id":"Obligation naturelle","t":"notion","md":"# Obligation naturelle\n\n> [!abstract] Définition\n> Devoir de conscience ou engagement moral envers autrui, sans force juridique en principe.\n\n## À retenir\n- L'exécution volontaire ou la promesse d'exécuter un devoir de conscience la transforme en obligation civile ([[Art. 1100]] al. 2).\n- Pas de novation : l'[[Engagement unilatéral de volonté]] suffit, sans obligation civile préexistante (TD1, docs 5 et 6).\n- Ne pas citer l'affaire Hallyday à l'examen : c'est une autre affaire.\n\n## Articles\n[[Art. 1100]]\n\n## Arrêts\n- [[Civ. 1re, 11 oct. 2017]]\n\n## Voir aussi\n[[Obligation]] · [[Engagement unilatéral de volonté]]\n\n## Sources\n[[CM2 Contrats]] · [[TD1 Contrats]]"},{"id":"Obligation","t":"notion","md":"# Obligation\n\n> [!abstract] Définition\n> Lien de droit entre un créancier, titulaire d'une créance, et un débiteur, titulaire d'une dette (du latin *obligare*, « lier »).\n\n## À retenir\n- Dans un [[Contrat synallagmatique]], chaque partie est à la fois créancière et débitrice (vente, bail).\n- Sources : l'acte juridique (contrat, engagement unilatéral), le fait juridique (délits, quasi-délits), la loi (obligation fiscale) et, rarement, l'[[Obligation naturelle]] : voir [[Acte juridique et fait juridique]].\n\n## Articles\n[[Art. 1100]]\n\n## Voir aussi\n[[Contrat]] · [[Obligation naturelle]]\n\n## Sources\n[[CM1 Contrats]] · [[CM2 Contrats]]"},{"id":"Offre","t":"notion","md":"# Offre\n\n> [!abstract] Définition\n> Proposition ferme et précise de contracter, comprenant les éléments essentiels du contrat envisagé et exprimant la volonté de son auteur d'être lié en cas d'acceptation ([[Art. 1114]]) ; à défaut, simple invitation à négocier.\n\n## À retenir\n- Forme libre ([[Art. 1113]]) ; son acceptation forme le contrat.\n- Rétractation libre tant qu'elle n'est pas parvenue au destinataire ([[Art. 1115]]) ; ensuite, maintien pendant le délai fixé ou raisonnable ([[Art. 1116]]) : sinon dommages-intérêts, jamais le contrat forcé.\n- Caducité ([[Art. 1117]]) : expiration du délai, incapacité ou décès de l'auteur, décès du destinataire (2018).\n- Pour une vente, éléments essentiels = la chose et le prix ([[Civ. 3e, 11 mai 2023]]).\n- Distinguer de la [[Promesse unilatérale de contrat]] ([[Soc., 21 sept. 2017]]).\n\n## Articles\n[[Art. 1113]] · [[Art. 1114]] · [[Art. 1115]] · [[Art. 1116]] · [[Art. 1117]]\n\n## Arrêts\n- [[Soc., 21 sept. 2017]]\n- [[Civ. 3e, 11 mai 2023]]\n\n## Voir aussi\n[[Acceptation]] · [[Pourparlers]] · [[Caducité]]\n\n## Sources\n[[CM3 Contrats]] · [[CM4 Contrats]] · [[TD2 Contrats]]"},{"id":"Ordre public","t":"notion","md":"# Ordre public\n\n> [!abstract] Définition\n> Ensemble des règles obligatoires touchant l'organisation de la nation, la morale, la santé, la sécurité et les libertés essentielles, auxquelles le contrat ne peut déroger ([[Art. 6]], [[Art. 1102]] al. 2, [[Art. 1162]]).\n\n## À retenir\n- Le contrat ne peut y déroger ni par ses stipulations ni par son but, connu ou non de toutes les parties ([[Art. 1162]]).\n- Corps humain hors commerce : GPA interdite ([[Art. 16-7]]), mais transcription admise sous l'influence de la CEDH ; dons gratuits seulement.\n- Exposition « Our Body » : assurance annulée (Civ. 1re, 29 oct. 2014).\n- Les bonnes mœurs disparaissent du droit commun des contrats.\n- Toujours nuancer : « l'objet est illicite, point » est presque toujours trop simple.\n\n## Articles\n[[Art. 6]] · [[Art. 1102]] · [[Art. 1162]] · [[Art. 16-7]]\n\n## Arrêts\n- [[Civ. 1re, 7 oct. 1998]]\n- [[Civ. 1re, 7 nov. 2000]]\n\n## Voir aussi\n[[Liberté contractuelle]] · [[Contenu du contrat]] · [[Droit impératif et droit supplétif]]\n\n## Sources\n[[CM1 Contrats]] · [[CM2 Contrats]] · [[CM5 Contrats]] · [[TD2 Contrats]]"},{"id":"Pacte de préférence","t":"notion","md":"# Pacte de préférence\n\n> [!abstract] Définition\n> Contrat par lequel le promettant s'engage à proposer prioritairement au bénéficiaire de traiter avec lui s'il décide de contracter ([[Art. 1123]]).\n\n## À retenir\n- Double option : le promettant reste libre de ne pas vendre, le bénéficiaire de ne pas acheter ; prix non fixé.\n- Violation : dommages-intérêts ; nullité ou substitution si le tiers connaissait l'**existence** du pacte **et** l'**intention** du bénéficiaire de s'en prévaloir ([[Ch. mixte, 26 mai 2006]], codifié al. 2).\n- [[Action interrogatoire]] du tiers (al. 3 et 4).\n- Pacte sans terme : pas nul, mais résiliable à tout moment ([[Civ. 1re, 25 sept. 2024]]) ; voir [[Engagements perpétuels]].\n- En pratique : clause pénale ; pacte d'associés pour écarter un tiers indésirable.\n\n## Articles\n[[Art. 1123]]\n\n## Arrêts\n- [[Ch. mixte, 26 mai 2006]]\n- [[Civ. 3e, 3 nov. 2011]]\n- [[Civ. 1re, 25 sept. 2024]]\n\n## Voir aussi\n[[Promesse unilatérale de contrat]] · [[Action interrogatoire]] · [[Offre]]\n\n## Sources\n[[CM3 Contrats]] · [[TD2 Contrats]]"},{"id":"Pourparlers","t":"notion","md":"# Pourparlers\n\n> [!abstract] Définition\n> Négociations précontractuelles : leur initiative, leur déroulement et leur rupture sont libres, mais doivent satisfaire aux exigences de la bonne foi ([[Art. 1112]]).\n\n## À retenir\n- Principe : liberté de rompre sans justification ; exception : la rupture **abusive** (brutale, de mauvaise foi, après avoir laissé croire à la conclusion).\n- Critères de l'abus : état d'avancement (prix, volume, délais) plus que la durée, brutalité, attentes légitimes, frais engagés, absence de motif légitime.\n- Responsabilité extracontractuelle ([[Art. 1240]]) ; contractuelle s'il existe un accord de négociation : voir [[Négociation encadrée]].\n- Préjudice réparé : les frais de négociation et d'études ; jamais les gains espérés ni la perte de chance de les obtenir ([[Art. 1112]] al. 2, codifiant [[Manoukian (Com., 26 nov. 2003)]]).\n- Confidentialité des informations reçues ([[Art. 1112-2]]).\n\n## Articles\n[[Art. 1112]] · [[Art. 1112-2]] · [[Art. 1240]]\n\n## Arrêts\n- [[Manoukian (Com., 26 nov. 2003)]]\n- [[Civ. 3e, 31 mai 2018]]\n- [[Civ. 3e, 11 mai 2023]]\n- [[Com., 22 mars 2017]]\n\n## Voir aussi\n[[Bonne foi]] · [[Négociation encadrée]] · [[Offre]]\n\n## Sources\n[[CM3 Contrats]] · [[TD2 Contrats]]"},{"id":"Promesse synallagmatique","t":"notion","md":"# Promesse synallagmatique\n\n> [!abstract] Définition\n> Avant-contrat où les deux parties s'engagent, l'une à vendre, l'autre à acheter (« compromis » de vente).\n\n## À retenir\n- La promesse de vente vaut vente lorsqu'il y a consentement réciproque sur la chose et le prix ([[Art. 1589]]).\n\n## Articles\n[[Art. 1589]]\n\n## Voir aussi\n[[Promesse unilatérale de contrat]] · [[Pacte de préférence]]\n\n## Sources\n[[CM3 Contrats]]"},{"id":"Promesse unilatérale de contrat","t":"notion","md":"# Promesse unilatérale de contrat\n\n> [!abstract] Définition\n> Contrat par lequel le promettant accorde au bénéficiaire le droit d'opter pour la conclusion d'un contrat dont les éléments essentiels sont déterminés et pour la formation duquel ne manque que son consentement ([[Art. 1124]]).\n\n## À retenir\n- Une seule option (celle du bénéficiaire) ; prix fixé ; indemnité d'immobilisation fréquente.\n- Révocation pendant le délai d'option : n'empêche pas la formation du contrat promis ([[Art. 1124]] al. 2), contre [[Consorts Cruz (Civ. 3e, 15 déc. 1993)]].\n- Promesses antérieures à 2016 : maintien de Cruz ([[Civ. 3e, 6 déc. 2018]]), puis revirement ([[Civ. 3e, 23 juin 2021]]), étendu à la rétractation avant l'ouverture du délai ([[Com., 15 mars 2023]]).\n- La levée d'option rend la vente parfaite ; exécution forcée ouverte aux deux parties ([[Civ. 3e, 22 juin 2023]]).\n- Contrat conclu avec un tiers de mauvaise foi : nul (al. 3) ; substitution non prévue.\n- Piège : ne pas confondre avec une [[Offre]] assortie d'un délai ([[Soc., 21 sept. 2017]]).\n- Conformité à la Constitution de l'al. 2 : [[Civ. 3e, 17 oct. 2019 (QPC)]].\n\n## Articles\n[[Art. 1124]]\n\n## Arrêts\n- [[Consorts Cruz (Civ. 3e, 15 déc. 1993)]]\n- [[Civ. 3e, 6 déc. 2018]]\n- [[Civ. 3e, 17 oct. 2019 (QPC)]]\n- [[Civ. 3e, 23 juin 2021]]\n- [[Com., 15 mars 2023]]\n- [[Civ. 3e, 22 juin 2023]]\n- [[Soc., 21 sept. 2017]]\n\n## Voir aussi\n[[Pacte de préférence]] · [[Promesse synallagmatique]] · [[Offre]]\n\n## Sources\n[[CM3 Contrats]] · [[TD2 Contrats]]"},{"id":"Représentation","t":"notion","md":"# Représentation\n\n> [!abstract] Définition\n> Pouvoir d'accomplir un acte juridique au nom et pour le compte d'autrui, dont les effets se produisent directement sur la tête du représenté ([[Art. 1153]] à [[Art. 1161]]).\n\n## À retenir\n- Parfaite ou imparfaite (commission) ([[Art. 1154]]) ; sources légale, judiciaire, conventionnelle ([[Art. 1159]]).\n- Pouvoir général : actes conservatoires et d'administration ; pouvoir spécial : actes visés ([[Art. 1155]]).\n- [[Action interrogatoire]] du tiers ([[Art. 1158]]).\n- Actes avec soi-même interdits pour les personnes physiques ([[Art. 1161]]) ; affaire Adidas-Tapie.\n- Dépassement de pouvoir : inopposabilité, sauf [[Mandat apparent]] ([[Art. 1156]]) ; détournement : nullité ([[Art. 1157]]) ; ratification possible.\n- Le dirigeant n'est responsable envers les tiers qu'en cas de faute séparable de ses fonctions ([[Com., 20 mai 2003 (Seusse)]]).\n\n## Articles\n[[Art. 1153]] · [[Art. 1154]] · [[Art. 1155]] · [[Art. 1156]] · [[Art. 1157]] · [[Art. 1158]] · [[Art. 1159]] · [[Art. 1161]] · [[Art. 1596]]\n\n## Arrêts\n- [[Com., 20 mai 2003 (Seusse)]]\n- [[Ass. plén., 13 déc. 1962]]\n\n## Voir aussi\n[[Mandat apparent]] · [[Capacité]] · [[Action interrogatoire]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Réforme de 2016","t":"notion","md":"# Réforme de 2016\n\n> [!abstract] Définition\n> Ordonnance du 10 février 2016, ratifiée par la loi du 20 avril 2018 : première refonte du droit des contrats depuis 1804, regroupée au Livre III du Code civil dans l'ordre chronologique (formation, exécution, sanctions).\n\n## À retenir\n- Objectifs : protéger le cocontractant (ex. [[Devoir précontractuel d'information]]), rendre le droit intelligible, le rendre attractif face aux droits étrangers.\n- S'applique aux contrats conclus à compter du **1er octobre 2016** (art. 9 de l'ordonnance) ; les contrats antérieurs restent soumis à l'ancien droit.\n- Sur une ligne de crête entre libéralisme économique et solidarité.\n- La cause disparaît en tant que mot, ses fonctions demeurent : voir [[Contenu du contrat]].\n\n## Arrêts\n- [[Com., 15 mars 2023]]\n- [[Civ. 3e, 23 juin 2021]]\n\n## Voir aussi\n[[Contrat]] · [[Contenu du contrat]]\n\n## Sources\n[[CM2 Contrats]] · [[CM5 Contrats]]"},{"id":"Silence","t":"notion","md":"# Silence\n\n> [!abstract] Définition\n> Absence totale de comportement : ne vaut pas acceptation ([[Art. 1120]] ; [[Civ., 25 mai 1870 (Guilloux)]]).\n\n## À retenir\n- Exceptions : loi, usages, relations d'affaires, circonstances particulières.\n- À distinguer de l'acceptation tacite (comportement).\n\n## Articles\n[[Art. 1120]]\n\n## Arrêts\n- [[Civ., 25 mai 1870 (Guilloux)]]\n\n## Voir aussi\n[[Acceptation]] · [[Bonne foi]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Vices du consentement","t":"notion","md":"# Vices du consentement\n\n> [!abstract] Définition\n> L'erreur, le dol et la violence vicient le consentement lorsque, sans eux, une partie n'aurait pas contracté ou aurait contracté à des conditions substantiellement différentes ([[Art. 1130]]).\n\n## À retenir\n- Caractère déterminant apprécié eu égard aux personnes et aux circonstances.\n- [[Erreur]] : on s'est trompé ; [[Dol]] : on a été trompé ; [[Violence]] : on a été contraint.\n- Sanction : [[Nullité relative]] ([[Art. 1131]]) ; 5 ans ([[Art. 1144]]) à compter de la découverte (erreur, dol) ou de la cessation (violence) ; dommages-intérêts ([[Art. 1178]] al. 4).\n\n## Articles\n[[Art. 1130]] · [[Art. 1131]] · [[Art. 1144]] · [[Art. 1178]]\n\n## Voir aussi\n[[Erreur]] · [[Dol]] · [[Violence]] · [[Conditions de validité du contrat]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Violence","t":"notion","md":"# Violence\n\n> [!abstract] Définition\n> Une partie s'engage sous la pression d'une contrainte qui lui inspire la crainte d'exposer sa personne, sa fortune ou celles de ses proches à un mal considérable ([[Art. 1140]]).\n\n## À retenir\n- Menace illégitime ; la menace d'une voie de droit n'est violence que si elle est détournée ou vise un avantage manifestement excessif ([[Art. 1141]]).\n- Crainte déterminante, appréciée in concreto.\n- Cause de nullité même si elle émane d'un tiers ([[Art. 1142]]).\n- Prolongement : l'[[Abus de dépendance]] ([[Art. 1143]]).\n\n## Articles\n[[Art. 1140]] · [[Art. 1141]] · [[Art. 1142]] · [[Art. 1143]]\n\n## Arrêts\n- [[Civ. 1re, 30 mai 2000]]\n- [[Civ. 1re, 3 avr. 2002]]\n\n## Voir aussi\n[[Abus de dépendance]] · [[Vices du consentement]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Ass. plén., 13 déc. 1962","t":"arret","md":"# Ass. plén., 13 déc. 1962\n\n*Ass. plén., 13 déc. 1962*\n\n> [!info] Faits\n> {faits}\n\n> [!success] Solution\n> {sol}\n\n**Portée.** {portee}\n\n## Notions\n[[Mandat apparent]] · [[Représentation]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Ass. plén., 1er déc. 1995","t":"essentiel","md":"# Ass. plén., 1er déc. 1995\n\n*Ass. plén., 1er déc. 1995 (4 arrêts)*\n\n> [!warning] Arrêt essentiel\n> Détermination du prix, repris aux art. 1164 et 1165.\n\n> [!info] Faits\n> {faits}\n\n> [!success] Solution\n> {sol}\n\n**Portée.** {portee}\n\n## Notions\n[[Détermination du prix]]\n\n## Sources\n[[CM5 Contrats]]"},{"id":"Baldus (Civ. 1re, 3 mai 2000)","t":"essentiel","md":"# Baldus (Civ. 1re, 3 mai 2000)\n\n*Civ. 1re, 3 mai 2000*\n\n> [!warning] Arrêt essentiel\n> Codifié à l'art. 1137 al. 3 : pas de dol par silence sur la valeur.\n\n> [!info] Faits\n> {faits}\n\n> [!success] Solution\n> {sol}\n\n**Portée.** {portee}\n\n## Notions\n[[Dol]] · [[Devoir précontractuel d'information]]\n\n## Sources\n[[CM4 Contrats]]"},{"id":"Cartier (Civ. 1re, 4 juill. 1995)","t":"arret","md":"# Cartier (Civ. 1re, 4 juill. 1995)\n\n*Civ. 1re, 4 juill. 1995*\n\n> [!info] Faits\n> {faits}\n\n> [!success] Solution\n> {sol}\n\n**Portée.** { }

node.call(d3.drag()
  .on("start", (e, d) => { if (!e.active) sim.alphaTarget(.2).restart(); d.fx = d.x; d.fy = d.y; })
  .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
  .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
node.on("click", (e, d) => { e.stopPropagation(); open(d.id, false); });
svg.on("click", () => { focusId = null; highlight(); intro(); });

// panel
const panel = document.getElementById("panel");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function inline(s) {
  s = esc(s);
  s = s.replace(/\[\[([^\]|#]+)\]\]/g, (m, x) => byId.has(x) ? `<a class="wl" data-id="${x}">${x}</a>` : x);
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a class="ext" href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\*([^*]+)\*/g, "<i>$1</i>");
  return s;
}
const CALLOUT = { warning: "Arrêt essentiel", abstract: "Définition", info: "Faits", success: "Solution", tip: "Texte intégral" };
function render(md) {
  const out = []; let list = null, call = null;
  const flush = () => { if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; } if (call) { out.push(`<div class="callout"><b class="t">${call.t}</b>${call.l.join("<br>")}</div>`); call = null; } };
  for (const raw of md.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if ((m = line.match(/^> \[!(\w+)\]\s*(.*)$/))) { flush(); call = { t: m[2] || CALLOUT[m[1]] || "", l: [] }; continue; }
    if (call && line.startsWith(">")) { call.l.push(inline(line.replace(/^>\s?/, ""))); continue; }
    if ((m = line.match(/^- (.*)$/))) { if (call) flush(); (list = list || []).push("<li>" + inline(m[1]) + "</li>"); continue; }
    flush();
    if (!line) continue;
    if ((m = line.match(/^# (.*)$/))) out.push("<h1>" + inline(m[1]) + "</h1>");
    else if ((m = line.match(/^## (.*)$/))) out.push("<h2>" + inline(m[1]) + "</h2>");
    else out.push("<p>" + inline(line) + "</p>");
  }
  flush(); return out.join("");
}
function open(id, center = true) {
  const n = byId.get(id); if (!n) return;
  focusId = id; highlight();
  panel.innerHTML = `<button class="close" type="button" aria-label="Fermer">×</button><div class="kind" style="color:var(--${n.t})">${KIND[n.t]} · ${nbr.get(id).size} liens</div><div class="note">${render(n.md)}</div>`;
  panel.scrollTop = 0;
  panel.querySelector(".close").onclick = () => { focusId = null; highlight(); intro(); };
  if (center) {
    const d = nodes.find(x => x.id === id), b = box(), s = Math.max(k, 1.2);
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(b.width / 2 - s * d.x, b.height / 2.6 - s * d.y).scale(s));
  }
}
panel.addEventListener("click", e => { const a = e.target.closest("a.wl"); if (a) { e.preventDefault(); open(a.dataset.id); } });
function intro() {
  const top = DATA.nodes.filter(n => n.t === "notion").sort((a, b) => deg.get(b.id) - deg.get(a.id)).slice(0, 8);
  panel.innerHTML = `<div class="intro"><div class="kind" style="color:var(--notion)">Droit des contrats</div><h2>${DATA.nodes.length} notes, ${DATA.links.length} liens</h2>
  <p>Chaque point est une note tirée de tes CM1 à CM5 et TD1-TD2. Touche un point pour lire la fiche et voir à quoi il est relié ; touche un lien dans la fiche pour voyager dans la toile.</p>
  <div class="legend"><div><b style="color:var(--notion)">●</b> Notions : définition, points à retenir</div><div><b style="color:var(--essentiel)">●</b> Arrêts essentiels : à connaître par cœur</div><div><b style="color:var(--arret)">●</b> Autres arrêts : faits, solution, portée</div><div><b style="color:var(--article)">●</b> Articles du Code civil</div><div><b style="color:var(--cours)">●</b> Cours et TD</div></div>
  <h2 style="font-family:var(--display);font-weight:500;font-size:18px;margin:20px 0 4px">Les arrêts essentiels</h2>
  <ul class="toplist">${DATA.nodes.filter(n => n.t === "essentiel").map(n => `<li><a class="wl" data-id="${n.id}" style="color:var(--essentiel)">${n.id}</a></li>`).join("")}</ul>
  <h2 style="font-family:var(--display);font-weight:500;font-size:18px;margin:20px 0 4px">Les notions les plus reliées</h2>
  <ul class="toplist">${top.map(n => `<li><a class="wl" data-id="${n.id}">${n.id}</a><span>${deg.get(n.id)} liens</span></li>`).join("")}</ul></div>`;
}
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase(); highlight();
});
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key !== "Enter" || !query) return;
  const order = { notion: 0, arret: 1, cours: 2, article: 3 };
  const hits = DATA.nodes.filter(n => n.id.toLowerCase().includes(query)).sort((a, b) => (b.id.toLowerCase() === query) - (a.id.toLowerCase() === query) || order[a.t] - order[b.t] || deg.get(b.id) - deg.get(a.id));
  const hit = hits[0];
  if (hit) open(hit.id);
});
fit(); labels(); intro();
window.addEventListener("resize", () => fit());
</script>
